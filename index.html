<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>העוזר שלי</title>
<meta name="description" content="משימות, תזכורות והתראות במקום אחד">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="עוזר">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Secular+One&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="wrap topbar-inner">
    <h1 class="view-title" id="viewTitle">העוזר שלי</h1>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="searchBtn" aria-label="חיפוש" aria-expanded="false" data-icon="search"></button>
      <button type="button" class="icon-btn" id="settingsBtn" aria-label="הגדרות" data-icon="sliders"></button>
    </div>
  </div>
  <div class="wrap search-row" id="searchRow" hidden>
    <label class="sr-only" for="searchInput">חיפוש</label>
    <input type="search" id="searchInput" class="text-input" placeholder="חיפוש במשימות ובהערות" autocomplete="off" enterkeyhint="search">
  </div>
</header>

<main id="main" class="wrap main"></main>

<button type="button" class="fab" id="fab"><span data-icon="plus"></span><span>משימה חדשה</span></button>

<nav class="tabbar" aria-label="ניווט ראשי">
  <div class="wrap tabbar-inner">
    <button type="button" class="tab" data-view="today"><span class="tab-ico" data-icon="sun"></span><span>היום</span><span class="tab-badge" id="todayBadge" hidden></span></button>
    <button type="button" class="tab" data-view="upcoming"><span class="tab-ico" data-icon="calendar"></span><span>בקרוב</span></button>
    <button type="button" class="tab" data-view="important"><span class="tab-ico" data-icon="star"></span><span>חשוב</span></button>
    <button type="button" class="tab" data-view="lists"><span class="tab-ico" data-icon="list"></span><span>רשימות</span></button>
  </div>
</nav>

<div id="alerts" class="alerts" aria-live="assertive"></div>
<div id="sheetRoot" class="sheet-root" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="wrap">כדי להשתמש בעוזר צריך להפעיל JavaScript בדפדפן.</p></noscript>
</body>
</html>
